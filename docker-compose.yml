services:
  postgres:
    image: ${DOCKER_LIBRARY_REGISTRY:-docker.io/library}/postgres:17-alpine
    environment:
      POSTGRES_DB: taskpilot
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: ${DOCKER_LIBRARY_REGISTRY:-docker.io/library}/redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      args:
        PYTHON_IMAGE: ${DOCKER_LIBRARY_REGISTRY:-docker.io/library}/python:3.13-slim
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build:
      context: ./apps/api
      args:
        PYTHON_IMAGE: ${DOCKER_LIBRARY_REGISTRY:-docker.io/library}/python:3.13-slim
    env_file: .env
    command: python -m app.bot.main
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      args:
        PYTHON_IMAGE: ${DOCKER_LIBRARY_REGISTRY:-docker.io/library}/python:3.13-slim
    env_file: .env
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./apps/api
      args:
        PYTHON_IMAGE: ${DOCKER_LIBRARY_REGISTRY:-docker.io/library}/python:3.13-slim
    env_file: .env
    command: celery -A app.worker.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NODE_IMAGE: ${DOCKER_LIBRARY_REGISTRY:-docker.io/library}/node:22-bookworm-slim
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
